[colors]
background = #000000
primary = #f7f1e2
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/mybar]
width = 99.4%
override-redirect = true
enable-ipc = true
offset-y = 0.4%
offset-x = 0.4%
height = 30pt
radius = 6
bottom = true
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt


padding-left = 0
padding-right = 1

module-margin = 1

separator = 
separator-foreground = ${colors.disabled}

font-0 = CaskaydiaCove Nerd Font
font-1 = CaskaydiaCove Nerd Font:size=15;3

modules-left = xworkspaces 
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date
modules-center = spotify-prev spotify spotify-next
cursor-click = pointer
cursor-scroll = ns-resize

wm-restack = i3

; wm-restack = generic
; wm-restack = bspwm

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#f7f1e2} %{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio


format-volume = <ramp-volume>  <label-volume>

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

label-volume = %percentage%%
label-muted = " "
label-muted-foreground = ${colors.primary}
ramp-volume-foreground = ${colors.primary} 
click-right = pavucontrol &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %{F#f7f1e2} %{F-} %layout%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
interval = 1.0
inherit = network-base
interface-type = wired
label-connected =%{F#f7f1e2}󰈀 %{F-} %downspeed%

[module/date]
type = internal/date
interval = 1

date = 󰃰 %H:%M  
date-alt = 󰃰  %H:%M:%S | %a | %b %d %Y

label = %date%
label-foreground = ${colors.primary}

[module/spotify]
type = custom/script
tail = true
interval = 1
format = <label>
exec = ~/.config/polybar/scripts/get_spotify_status.sh
click-left = playerctl --player=spotify play-pause

[module/spotify-prev]
type = custom/script
exec = echo "%{T2}󰒮"
format = <label>
click-left = playerctl previous -p spotify

[module/spotify-next]
type = custom/script
exec = echo "%{T2}󰒭"
format = <label>
click-left = playerctl next -p spotify

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
