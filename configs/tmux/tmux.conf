# ==========================================
# GENERAL SETTINGS
# ==========================================

# Change default prefix from Ctrl+b to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable full mouse support (click, resize, scroll)
set -g mouse on

setw -g mode-keys vi
# Increase scrollback history limit
set -g history-limit 50000

# Fix escape time delay for Vim/Neovim users
set -s escape-time 0

# Enable true color support (24-bit color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ==========================================
# KEY BINDINGS
# ==========================================

# Easy config reload with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using intuitive | and - keys (opens in current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes using Vim motions (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use Alt + Arrow keys to switch windows without the prefix key
bind -n M-Left previous-window
bind -n M-Right next-window

# ==========================================
# STATUS BAR & COSMETICS
# ==========================================

# Simple and clean status bar styling
set -g status-position bottom
set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"

# Highlight the active window in the status bar
setw -g window-status-current-style bg=blue,fg=black,bold

# Color the borders of the panes
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=blue
